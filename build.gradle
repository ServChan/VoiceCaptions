plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def fabricKeyMappingApiVersion = project.fabric_key_mapping_api_version
def fabricLifecycleEventsVersion = project.fabric_lifecycle_events_version
def fabricRenderingVersion = project.fabric_rendering_version
def fabricCommandApiVersion = project.fabric_command_api_version
def plasmoVoiceApiVersion = project.plasmovoice_api_version
def localModMenu = file(project.modmenu_jar)

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Plasmoverse"
        url = "https://repo.plasmoverse.com/releases"
    }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "voicecaptions" {
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabricKeyMappingApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabricLifecycleEventsVersion}"
    implementation "net.fabricmc.fabric-api:fabric-rendering-v1:${fabricRenderingVersion}"
    implementation "net.fabricmc.fabric-api:fabric-command-api-v2:${fabricCommandApiVersion}"
    compileOnly "su.plo.voice.api:client:${plasmoVoiceApiVersion}"

    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
            transitive = false
        }
    }

    testImplementation sourceSets.client.output
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.10.1"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion
    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
